name: MathMode runtime CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q mathmode tests
      - name: Check contract schemas
        run: python tools/build_contract_schemas.py --check
      - name: Check mirrored agent assets
        run: python tools/sync_agent_assets.py --check
      - name: Run regression suite
        run: pytest -q -p no:cacheprovider --basetemp=${{ runner.temp }}\mathmode-pytest
